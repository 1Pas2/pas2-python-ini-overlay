[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pas2-python-ini-overlay"
version = "0.1.0"
description = "Merge INI configuration layers without interpolation."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "1Pas2"}]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
